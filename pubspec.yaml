name: stick_party
description: "Stick Party — 2 3 4 Player Games. Local-multiplayer one-touch minigames with procedural stickman art. Offline."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # Game loop + rendering
  flame: ^1.32.0

  # State management
  flutter_riverpod: ^2.6.1

  # Offline persistence (no codegen — raw boxes)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Navigation
  go_router: ^14.6.2

  # UI micro-animations (pure dart)
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

# Procedural launcher icon (two stickmen in a sumo shove; generated by test/gen_icon.dart).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#15102B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
